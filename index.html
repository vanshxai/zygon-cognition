<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zygon.cognition</title>
<meta name="description" content="Engineering back-office intelligence for HVAC engineers.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%237c4dff%27/%3E%3Ctext x=%2716%27 y=%2723%27 font-size=%2720%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27Arial%27 font-weight=%27700%27%3EZ%3C/text%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('zc_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top"><div class="logo sm"><span class="z">Zygon</span><span class="dot">.</span><span class="c">cognition</span></div></div>
    <button class="newchat" id="newchat">＋ New chat</button>
    <div class="side-label">Recent</div>
    <nav id="chatlist" class="chatlist"></nav>
    <button class="setbtn" id="settingsbtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="modal" id="consent" hidden><div class="mbox"><div class="mh"><b>Before you start: this is a test version</b></div><div class="mb" id="consentbody"></div></div></div>
  <div class="modal" id="settings" hidden><div class="mbox"><div class="mh"><b>Settings</b><button class="icon" id="setclose" aria-label="Close">✕</button></div><div class="mb" id="setbody"></div></div></div>
  <main>
    <header class="top">
      <button class="icon" id="menu" aria-label="Toggle sidebar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="spacer"></div>
      <button class="icon" id="theme" aria-label="Switch theme"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <div class="body"><section id="stage" class="stage" aria-live="polite"></section><aside class="rail" id="rail"></aside></div>
    <footer class="composer">
      <div id="chips" class="chips"></div>
      <div class="box"><div class="ctxpop" id="ctxpop" hidden></div>
        <button class="icon" id="attach" aria-label="Attach files"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></button>
        <input type="file" id="file" multiple hidden>
        <div class="field"><div class="ghost" id="ghost" aria-hidden="true"></div><input id="q" type="text" autocomplete="off" spellcheck="false" placeholder=""></div>
        <button class="icon" id="mic" aria-label="Speak instead of typing" title="Speak (uses your browser's speech service)" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="send" id="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><button class="icon ctxbtn" id="ctxbtn" aria-label="Context and metrics" title="Context and metrics"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" opacity=".35"/><path d="M12 3a9 9 0 0 1 9 9"/><circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></button>
      </div>
      <div class="hint"><kbd>Tab</kbd> or <kbd>Enter</kbd> types the suggestion in · <kbd>Enter</kbd> again sends</div>
    </footer>
  </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
