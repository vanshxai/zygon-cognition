<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frost 1.0 - math board</title>
<style>
:root{--bg:#06323B;--panel:#0A4A57;--ink:#E6F5F7;--mute:#8CC3CC;--acc:#14A9B8}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.4 Consolas,monospace;display:flex;flex-direction:column;overflow:hidden}
#bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#042932;flex:none;flex-wrap:wrap}
#bar button,#bar select{background:var(--panel);color:var(--ink);border:1px solid #1B7285;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
#bar button:hover{background:#0E6275}#bar b{color:#9FE7EF}
#seek{flex:1;min-width:160px;accent-color:#14A9B8}
#cvw{flex:1;min-height:300px;position:relative}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#term{height:27vh;min-height:130px;background:#021A20;border-top:2px solid #14A9B8;flex:none;overflow:hidden;position:relative}
#tp{margin:0;padding:8px 14px;color:#BDEFF3;white-space:pre-wrap;position:absolute;bottom:0;left:0;right:0;font-size:12.5px}
#tp i{color:#FFD166;font-style:normal}
</style></head><body>
<div id="bar">
 <b>Frost 1.0 math board</b>
 <button id="bp">|&lt; scene</button><button id="b1">&lt; step</button><button id="bplay">Play</button><button id="b2">step &gt;</button><button id="bn">scene &gt;|</button>
 speed <select id="spd"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>10</option><option>30</option></select>
 scene <select id="scn"></select>
 <input id="seek" type="range" min="0" value="0"><span id="cnt"></span><button id="fs">Full screen</button>
</div>
<div id="cvw"><canvas id="cv"></canvas></div>
<div id="term"><pre id="tp"></pre></div>
<script>
const D = /*__DATA__*/null;
const $ = s => document.querySelector(s);
const cv = $('#cv'), cx = cv.getContext('2d');
const C = {bg:'#06323B', panel:'#0A4A57', ink:'#E6F5F7', mute:'#8CC3CC', acc:'#14A9B8', pos:[61,232,212], neg:[255,154,77], hi:'#FFD166', line:'#1B7285', ok:'#7CF2A0'};
let W = 800, H = 500, DPR = 1;
function fit() { const r = $('#cvw').getBoundingClientRect(); DPR = window.devicePixelRatio || 1; const K = Math.min(1, r.height / 680, r.width / 1200); W = r.width / K; H = r.height / K; cv.width = r.width * DPR; cv.height = r.height * DPR; cx.setTransform(DPR * K, 0, 0, DPR * K, 0, 0); }
window.addEventListener('resize', fit);

// ---------------------------------------------------------------- number helpers
function f(x) { if (x === 0) return '0'; const a = Math.abs(x); if (a >= 1e5 || a < 1e-3) return x.toExponential(2).replace('e+', 'e'); let s = x.toPrecision(4); if (s.includes('.') && !s.includes('e')) s = s.replace(/0+$/, '').replace(/\.$/, ''); return s; }
const pad = (s, n) => String(s).padStart(n), padr = (s, n) => String(s).padEnd(n);
const vis = s => s.replace(/\n/g, '\\n').replace(/ /g, '\u2423');
function q8(o) { if (!o._q) { const b = atob(o.d), a = new Int8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = (b.charCodeAt(i) << 24) >> 24; o._q = a; } return o._q; }
function u8(s) { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
function gridImg(o, rows, cols) {
  if (o._img) return o._img;
  const q = q8(o), c = document.createElement('canvas'); c.width = cols; c.height = rows; const g = c.getContext('2d'), im = g.createImageData(cols, rows);
  for (let i = 0; i < rows * cols; i++) { const v = q[i] / 127, a = Math.min(1, Math.abs(v) * 1.15), col = v >= 0 ? C.pos : C.neg;
    im.data[4 * i] = 8 + (col[0] - 8) * a; im.data[4 * i + 1] = 40 + (col[1] - 40) * a; im.data[4 * i + 2] = 50 + (col[2] - 50) * a; im.data[4 * i + 3] = 255; }
  g.putImageData(im, 0, 0); o._img = c; return c;
}

// ---------------------------------------------------------------- drawing primitives
function T(s, x, y, o = {}) { cx.font = `${o.b ? 'bold ' : ''}${o.size || 13}px Consolas, monospace`; cx.fillStyle = o.c || C.ink; cx.textAlign = o.al || 'left'; cx.textBaseline = o.bl || 'alphabetic'; cx.fillText(s, x, y); }
function rect(x, y, w, h, c, lw = 1) { cx.strokeStyle = c || C.line; cx.lineWidth = lw; cx.strokeRect(x + .5, y + .5, w, h); }
function fillr(x, y, w, h, c) { cx.fillStyle = c; cx.fillRect(x, y, w, h); }
function arrow(x1, y1, x2, y2, c = C.mute) { cx.strokeStyle = c; cx.fillStyle = c; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(x1, y1); cx.lineTo(x2, y2); cx.stroke(); const a = Math.atan2(y2 - y1, x2 - x1); cx.beginPath(); cx.moveTo(x2, y2); cx.lineTo(x2 - 9 * Math.cos(a - .4), y2 - 9 * Math.sin(a - .4)); cx.lineTo(x2 - 9 * Math.cos(a + .4), y2 - 9 * Math.sin(a + .4)); cx.fill(); }
/** draw a vector as a rows x cols heat-grid inside the box (x,y,w,h); returns the drawn rectangle. `t` sweeps it in from the left */
function grid(o, rows, cols, x, y, w, h, label, sub, t = 1, mark = -1) {
  const cell = Math.min(w / cols, h / rows), gw = cell * cols, gh = cell * rows, gx = x + (w - gw) / 2, gy = y + (h - gh) / 2;
  cx.save(); cx.beginPath(); cx.rect(gx, gy, gw * Math.max(0, Math.min(1, t)), gh); cx.clip(); cx.imageSmoothingEnabled = false; cx.drawImage(gridImg(o, rows, cols), gx, gy, gw, gh); cx.restore();
  rect(gx - 1, gy - 1, gw + 1, gh + 1, C.line);
  if (mark >= 0 && t > .5) { const r = Math.floor(mark / cols), c = mark % cols; cx.strokeStyle = C.hi; cx.lineWidth = 2; cx.strokeRect(gx + c * cell - 2, gy + r * cell - 2, Math.max(cell, 4) + 4, Math.max(cell, 4) + 4); }
  if (label) T(label, x + w / 2, y - 22, {al: 'center', b: 1, size: 13}); if (sub) T(sub, x + w / 2, y - 7, {al: 'center', c: C.mute, size: 11});
  return {x: gx, y: gy, w: gw, h: gh, cell};
}
function table(rows, x, y, o = {}) {      // rows of strings/numbers drawn as a numeric block
  const cw = o.cw || 66, ch = o.ch || 20;
  rows.forEach((r, i) => { if (o.hrow === i) fillr(x - 4, y + i * ch - 14, cw * r.length + 6, ch, '#1b6b7a'); r.forEach((v, j) => T(typeof v === 'number' ? f(v) : v, x + j * cw + cw - 8, y + i * ch, {al: 'right', size: o.size || 12, c: (o.hrow === i) ? C.hi : (o.c || C.ink)})); });
}
function chips() {   // where we are inside one layer
  const names = ['norm', 'Q K V', 'RoPE', 'scores', 'p\u00B7V', 'W_o', '+', 'norm', 'gate', 'up', 'SiLU\u00D7', 'down', '+', 'lens'];
  const st = S[cur]; if (st.l == null) return; const k = ['norm1', 'qkv', 'rope', 'scores', 'ctx', 'o', 'res1', 'norm2', 'gate', 'up', 'act', 'down', 'res2', 'lens'].indexOf(st.k);
  let x = 16; names.forEach((n, i) => { const w = n.length * 8 + 16; fillr(x, 66, w, 22, i === k ? C.acc : C.panel); T(n, x + w / 2, 81, {al: 'center', size: 12, c: i === k ? '#02272f' : C.mute, b: i === k}); x += w + 4; });
  for (let i = 0; i < 36; i++) fillr(W - 16 - (36 - i) * 9, 70, 7, 14, i === st.l ? C.hi : i < st.l ? C.acc : C.panel);
  T('layer', W - 16 - 36 * 9 - 6, 81, {al: 'right', size: 11, c: C.mute});
}

// ---------------------------------------------------------------- generic "row of weights x input vector" scene
function matmul(c, t) {
  const ax = 26, top = 150, aw = Math.min(330, W * .27), ah = Math.min(200, H * .3);
  const A = grid(c.inV, c.inShape[0], c.inShape[1], ax, top, aw, ah, c.inLabel, c.inSub, Math.min(1, t * 4));
  T('\u00D7', ax + aw + 14, top + ah / 2 + 6, {size: 26, c: C.mute, al: 'center'});
  const bx = ax + aw + 36, bs = Math.min(ah, 190);        // weight matrix box
  fillr(bx, top, bs, bs, '#0B3F4B'); for (let i = 1; i < 8; i++) { fillr(bx + i * bs / 8, top, 1, bs, '#12596a'); fillr(bx, top + i * bs / 8, bs, 1, '#12596a'); }
  rect(bx, top, bs, bs, C.line, 2); T(c.wLabel, bx + bs / 2, top - 22, {al: 'center', b: 1}); T(c.wSub, bx + bs / 2, top - 7, {al: 'center', c: C.mute, size: 11});
  const ry = top + bs * c.rowFrac, p2 = Math.max(0, Math.min(1, (t - .2) * 4));
  if (p2 > 0) { fillr(bx, ry - 1, bs * p2, 3, C.hi); T(c.rowName, bx + bs + 6, ry + 4, {size: 11, c: C.hi}); }
  const nx = bx + bs + 20 + 70;         // numeric block with the real weights
  if (p2 > 0.6 && c.blk) { T('real numbers of the weight matrix W (columns 0-7):', nx, top - 8, {size: 11, c: C.mute}); table(c.blk, nx, top + 14, {hrow: c.hrow, cw: 62}); }
  else if (p2 > .6) { T('the weights used (first 8 of the row):', nx, top - 8, {size: 11, c: C.mute}); table([c.wrow], nx, top + 14, {hrow: 0, cw: 62}); }
  const ox = Math.min(W - 26 - Math.min(330, W * .27), nx + 8 * 62 + 40);
  T('=', ox - 18, top + ah / 2 + 6, {size: 26, c: C.mute, al: 'center'});
  const O = grid(c.outV, c.outShape[0], c.outShape[1], ox, top, Math.min(W - ox - 26, 330), ah, c.outLabel, c.outSub, Math.min(1, Math.max(0, (t - .7) * 4)), c.outIdx);
  // arithmetic
  const fy = top + bs + 36; T(c.title, 26, fy, {b: 1, size: 14, c: C.hi});
  const rc = c.rc, nt = rc.terms.length, shown = Math.floor(Math.max(0, (t - .3) / .45 * (nt + 1)));
  T('weight w[j]', 190, fy + 22, {al: 'right', size: 11, c: C.mute}); T('input x[j]', 330, fy + 22, {al: 'right', size: 11, c: C.mute}); T('w \u00D7 x', 470, fy + 22, {al: 'right', size: 11, c: C.mute});
  for (let i = 0; i < nt && i < shown; i++) { const y = fy + 42 + i * 19; T(`j=${i}`, 60, y, {c: C.mute, size: 12}); T(f(rc.terms[i][0]), 190, y, {al: 'right'}); T('\u00D7', 214, y, {al: 'center', c: C.mute}); T(f(rc.terms[i][1]), 330, y, {al: 'right'}); T('=', 352, y, {al: 'center', c: C.mute}); T(f(rc.terms[i][2]), 470, y, {al: 'right', c: rc.terms[i][2] >= 0 ? '#7CF2E0' : '#FFB27A'}); }
  if (shown > nt) { const y = fy + 42 + nt * 19; T(`+ ${rc.n - nt} more terms, together`, 60, y, {c: C.mute}); T(f(rc.rest), 470, y, {al: 'right'}); T(`+ bias ${f(rc.bias)}`, 560, y, {c: C.mute}); }
  if (t > .8) { const y = fy + 42 + (nt + 1) * 19; T(`= ${f(rc.out)}`, 470, y, {al: 'right', b: 1, size: 15, c: C.ok}); T(`<- ${c.outName} (checked: the sum above equals the model's own value)`, 486, y, {c: C.ok, size: 12}); }
}
function lines_mm(c) {
  const rc = c.rc; const o = [`${c.title}`, `  ${c.formula}`];
  rc.terms.forEach((r, i) => o.push(`    j=${i}:  ${pad(f(r[0]), 10)} x ${pad(f(r[1]), 10)} = ${pad(f(r[2]), 11)}`));
  o.push(`    ... + ${rc.n - rc.terms.length} more terms (together ${f(rc.rest)})  + bias ${f(rc.bias)}`, `  = ${f(rc.out)}   <- ${c.outName}`); return o;
}

// ---------------------------------------------------------------- the timeline
const S = [];
const add = (k, scene, extra = {}) => S.push(Object.assign({k, scene}, extra));
add('title', 'Start'); add('template', '1  Prompt text'); add('tokens', '2  Tokens (numbers)'); add('embed', '3  Embedding lookup');
for (let l = 0; l < D.layers.length; l++) ['norm1', 'qkv', 'rope', 'scores', 'ctx', 'o', 'res1', 'norm2', 'gate', 'up', 'act', 'down', 'res2', 'lens'].forEach(k => add(k, 'Layer ' + l, {l}));
add('fnorm', '4  Final norm'); add('logits', '5  Logits'); add('softmax', '6  Probabilities'); add('pick', '7  The chosen word'); add('gen', '8  Whole answer'); add('decode', '9  Numbers back to text');

const DIM = D.dims, LY = i => D.layers[i], F = D.final;
const TITLES = {norm1: 'RMSNorm (attention input)', qkv: 'Q, K, V projections', rope: 'RoPE: rotate Q and K by position', scores: 'Attention scores: which earlier tokens matter?', ctx: 'Mix the V vectors with those weights', o: 'Output projection W_o',
  res1: 'Residual add (attention)', norm2: 'RMSNorm (feed-forward input)', gate: 'Feed-forward: gate neuron', up: 'Feed-forward: up neuron', act: 'SiLU(gate) \u00D7 up = neuron activation', down: 'Down projection (back to 2048)', res2: 'Residual add (feed-forward)', lens: 'What would the model say if it stopped here?'};
const WHY = {norm1: 'Rescale the 2048 numbers so their typical size is 1, then multiply each by a learned gain g.', qkv: 'Three weight rows turn the vector h into a query (what I look for), a key (what I contain) and a value (what I give).',
  rope: 'Q and K are rotated in pairs by an angle that depends on the token position, so attention knows distances.', scores: 'score_j = q\u00B7k_j / \u221A128 for every earlier token j, then softmax turns scores into weights that sum to 1.',
  ctx: 'The output is the weighted sum of the value vectors: \u03A3 p_j \u00B7 v_j, done for all 16 heads.', o: 'The 16 head outputs (2048 numbers) are mixed by W_o (2048\u00D72048).', res1: 'The attention result is ADDED to the original vector (a shortcut that keeps earlier information).',
  norm2: 'Same normalisation again before the feed-forward block.', gate: 'Each of 11,008 neurons has a weight row. gate = W_gate[n] \u00B7 h. Shown: the most active neuron.', up: 'The same neuron has a second row: up = W_up[n] \u00B7 h.',
  act: 'SiLU(z) = z / (1 + e^-z). The neuron fires with strength SiLU(gate) \u00D7 up. Most neurons stay near 0.', down: 'W_down turns the 11,008 neuron activations into 2048 numbers (a weighted mix of neuron columns).', res2: 'The feed-forward result is ADDED to the vector again. This is the output of the layer.', lens: 'Taking the layer output and applying the final steps early shows how the answer forms layer by layer.'};

// ---------------------------------------------------------------- per-step terminal text
function textFor(st) {
  const l = st.l, L = l != null ? LY(l) : null, o = [];
  const hdrL = x => { o.push(`<i>=== ${st.scene}: ${x} ===</i>`); if (WHY[st.k]) o.push('  ' + WHY[st.k]); };
  switch (st.k) {
    case 'title': o.push(`<i>=== Frost 1.0: the trip of one question through the model ===</i>`, `  question: "${D.question}"`, `  model: ${DIM.layers} layers, width ${DIM.dim}, ${DIM.heads} heads (${DIM.kv} key/value heads), ${DIM.ffn} neurons per layer, vocabulary ${DIM.vocab}, ${D.weights_note}`, `  tracked: the LAST prompt token (position ${D.T - 1}) - the one that produces the first answer word.`, `  every number on this board is a real value from the real weights, recorded when the model ran.`); break;
    case 'template': o.push(`<i>=== 1 Prompt text: the model never sees raw text, it sees this chat template ===</i>`); D.template.split('\n').forEach(s => o.push('  ' + vis(s) + '\u21B5')); break;
    case 'tokens': o.push(`<i>=== 2 Tokens: text is cut into ${D.T} pieces; each piece is one whole number (its id) ===</i>`); D.ids.forEach((id, i) => o.push(`  position ${pad(i, 2)}   id ${pad(id, 6)}   piece "${vis(D.pieces[i])}"   bytes ${D.bytes[i].join(' ')}`)); break;
    case 'embed': o.push(`<i>=== 3 Embedding: each id picks one ROW of the 151,936 x 2048 embedding matrix (first 8 of 2048 numbers shown) ===</i>`); D.ids.forEach((id, i) => o.push(`  id ${pad(id, 6)} "${padr(vis(D.pieces[i]), 12)}" -> [${D.emb[i].map(a => pad(f(a), 8)).join(' ')} ...]   length ${f(D.emb_norm[i])}`)); break;
    case 'norm1': case 'norm2': { const n = L[st.k], gg = st.k === 'norm1' ? 'attn_norm' : 'ffn_norm'; hdrL(TITLES[st.k]); o.push(`  mean of squares = ${f(n.ms)}   rms = sqrt(${f(n.ms)} + ${n.eps}) = ${f(n.rms)}`, `  h[i] = x[i] / rms \u00D7 g[i]    (g = weights blk.${l}.${gg}.weight)`); n.e.forEach((r, i) => o.push(`    i=${i}:  ${f(r[0])} / ${f(n.rms)} \u00D7 ${f(r[1])} = ${f(r[2])}`)); break; }
    case 'qkv': hdrL(TITLES.qkv); [['q', 'W_q', 'attn_q'], ['k', 'W_k', 'attn_k'], ['v', 'W_v', 'attn_v']].forEach(([a, nm, tn]) => { const e = L[a]; o.push(`  ${a.toUpperCase()} element ${e.row} = ${nm}[${e.row}] \u00B7 h + bias   (blk.${l}.${tn}.weight row ${e.row})`); e.rc.terms.slice(0, 3).forEach((r, i) => o.push(`      j=${i}: ${f(r[0])} \u00D7 ${f(r[1])} = ${f(r[2])}`)); o.push(`      ... = ${f(e.rc.out)}`); }); break;
    case 'rope': hdrL(TITLES.rope); o.push(`  head ${L.att.head}, position ${D.T - 1}:  x1' = x1 cos\u03B8 - x2 sin\u03B8 ;  x2' = x2 cos\u03B8 + x1 sin\u03B8`); L.att.rope.forEach(r => o.push(`    pair ${r.i}: \u03B8 = ${f(r.a)} rad   (${f(r.x1)}, ${f(r.x2)}) -> (${f(r.r1)}, ${f(r.r2)})`)); break;
    case 'scores': hdrL(TITLES.scores); o.push(`  head ${L.att.head} (it looks hardest at one token). score_j = q\u00B7k_j/\u221A128, p = softmax(score)`); L.att.scores.forEach((s, j) => o.push(`    token ${pad(j, 2)} "${padr(vis(D.pieces[j]), 10)}"  score ${pad(f(s), 8)}  weight ${pad(f(L.att.probs[j]), 8)} ${'#'.repeat(Math.round(L.att.probs[j] * 40))}`)); break;
    case 'ctx': hdrL(TITLES.ctx); o.push(`  head ${L.att.head} output = \u03A3_j p_j \u00B7 v_j over ${D.T} tokens;  all 16 heads side by side = 2048 numbers (16 rows of 128)`); break;
    case 'o': hdrL(TITLES.o); lines_mm({title: `W_o row ${L.o.row} \u00B7 attention context`, formula: `attn_out[${L.o.row}] = \u03A3_j W_o[${L.o.row},j] \u00D7 ctx[j]   (blk.${l}.attn_output.weight)`, rc: L.o.rc, outName: `attn_out[${L.o.row}]`}).forEach(s => o.push(s)); break;
    case 'res1': hdrL(TITLES.res1); L.res1.forEach((r, i) => o.push(`    i=${i}:  x ${f(r[0])}  +  attention ${f(r[1])}  =  ${f(r[2])}`)); break;
    case 'gate': case 'up': { hdrL(TITLES[st.k]); const n = L.neurons[0]; o.push(`  neuron #${n.n} of ${DIM.ffn} in layer ${l}   (blk.${l}.ffn_${st.k}.weight row ${n.n})`); lines_mm({title: '', formula: `${st.k}[${n.n}] = W_${st.k}[${n.n}] \u00B7 h`, rc: st.k === 'gate' ? n.rg : n.ru, outName: `${st.k}[${n.n}]`}).slice(1).forEach(s => o.push(s)); break; }
    case 'act': { hdrL(TITLES.act); L.neurons.forEach(n => o.push(`  neuron #${pad(n.n, 5)}:  gate ${f(n.gate)} -> SiLU = ${f(n.gate / (1 + Math.exp(-n.gate)))}   \u00D7 up ${f(n.up)}  =  ${f(n.act)}`)); o.push(`  ${L.down.active} of ${DIM.ffn} neurons are at least 10% as strong as the loudest one (${(100 * L.down.active / DIM.ffn).toFixed(1)}%).`); break; }
    case 'down': hdrL(TITLES.down); lines_mm({title: `W_down row ${L.down.row} \u00B7 neuron activations`, formula: `mlp_out[${L.down.row}] = \u03A3_n W_down[${L.down.row},n] \u00D7 act[n]  over ${DIM.ffn} neurons   (blk.${l}.ffn_down.weight)`, rc: L.down.rc, outName: `mlp_out[${L.down.row}]`}).forEach(s => o.push(s)); break;
    case 'res2': hdrL(TITLES.res2); L.res2.forEach((r, i) => o.push(`    i=${i}:  x ${f(r[0])}  +  feed-forward ${f(r[1])}  =  ${f(r[2])}`)); break;
    case 'lens': hdrL(TITLES.lens); o.push('  ' + L.lens.map(a => `"${vis(a[0])}" ${(100 * a[1]).toFixed(1)}%`).join('   ')); break;
    case 'fnorm': o.push(`<i>=== 4 Final RMSNorm (output_norm.weight) ===</i>`, `  rms = ${f(F.rms)}`); F.e.forEach((r, i) => o.push(`    i=${i}:  ${f(r[0])} / ${f(F.rms)} \u00D7 ${f(r[1])} = ${f(r[2])}`)); break;
    case 'logits': o.push(`<i>=== 5 Logits: the vector is compared with ALL ${F.vocab} rows of the output table (one row per word-piece) ===</i>`, `  logit[token] = row[token] \u00B7 h    shown for the winner, id ${F.first} "${vis(F.top[0].piece)}":`); F.rc.terms.forEach((r, i) => o.push(`    j=${i}: ${f(r[0])} \u00D7 ${f(r[1])} = ${f(r[2])}`)); o.push(`    ... + ${F.rc.n - 6} more terms = ${f(F.rc.out)}`, `  top 10 logits: ` + F.top.map(a => `"${vis(a.piece)}" ${f(a.logit)}`).join('  ')); break;
    case 'softmax': o.push(`<i>=== 6 Softmax: logits -> probabilities  p = e^(z - max) / \u03A3 e^(z - max) ===</i>`, `  max logit ${f(F.max_logit)},  \u03A3 e^(z-max) over ${F.vocab} pieces = ${f(F.sum_exp)}`); F.top.forEach(a => o.push(`    id ${pad(a.id, 6)} "${padr(vis(a.piece), 10)}" logit ${pad(f(a.logit), 7)}  p = ${(100 * a.p).toFixed(2)}% ${'#'.repeat(Math.round(a.p * 50))}`)); break;

  }
}

// ---------------------------------------------------------------- player
let cur = 0, tt = 1, playing = false, last = 0, shownTxt = '';
const DUR = 2600;
$('#seek').max = S.length - 1; $('#cnt').textContent = '';
const scn = $('#scn'); let lastScene = ''; S.forEach((s, i) => { if (s.scene !== lastScene) { const o = document.createElement('option'); o.value = i; o.textContent = s.scene; scn.appendChild(o); lastScene = s.scene; } });
function go(i, anim) { cur = Math.max(0, Math.min(S.length - 1, i)); tt = anim ? 0 : 1; shownTxt = ''; $('#seek').value = cur; scn.value = [...scn.options].filter(o => +o.value <= cur).pop().value; }
function tick(ts) {
  const dt = Math.min(100, ts - last); last = ts;
  if (playing) { tt += dt * (+$('#spd').value) / DUR; if (tt >= 1) { if (cur < S.length - 1) go(cur + 1, true); else { tt = 1; playing = false; $('#bplay').textContent = 'Play'; } } $('#seek').value = cur; }
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H); draw(S[cur], Math.min(1, tt));
  const lines = []; for (let i = Math.max(0, cur - 5); i <= cur; i++) { const ls = textFor(S[i]); if (i === cur) { const n = Math.ceil(ls.length * Math.min(1, tt * 1.4)); lines.push(...ls.slice(0, n)); } else lines.push(...ls); }
  const txt = lines.join('\n'); if (txt !== shownTxt) { shownTxt = txt; $('#tp').innerHTML = txt.replace(/&/g, '&amp;').replace(/<(?!\/?i>)/g, '&lt;'); }
  $('#cnt').textContent = `step ${cur + 1}/${S.length}`;
  requestAnimationFrame(tick);
}
$('#bplay').onclick = () => { playing = !playing; if (playing && tt >= 1) { if (cur >= S.length - 1) go(0, true); else go(cur + 1, true); } $('#bplay').textContent = playing ? 'Pause' : 'Play'; };
$('#b1').onclick = () => { playing = false; $('#bplay').textContent = 'Play'; go(cur - 1, false); }; $('#b2').onclick = () => { playing = false; $('#bplay').textContent = 'Play'; go(cur + 1, false); };
$('#bp').onclick = () => { playing = false; $('#bplay').textContent = 'Play'; const i = [...scn.options].map(o => +o.value); go(i[Math.max(0, i.filter(v => v < cur).length - 1)], false); };
$('#bn').onclick = () => { playing = false; $('#bplay').textContent = 'Play'; const nx = [...scn.options].map(o => +o.value).find(v => v > cur); go(nx === undefined ? cur : nx, false); };
$('#seek').oninput = e => { playing = false; $('#bplay').textContent = 'Play'; go(+e.target.value, false); };
scn.onchange = e => { playing = false; $('#bplay').textContent = 'Play'; go(+e.target.value, false); };
$('#fs').onclick = () => document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); $('#bplay').click(); } else if (e.key === 'ArrowRight') $('#b2').click(); else if (e.key === 'ArrowLeft') $('#b1').click(); });
fit(); go(0, false); requestAnimationFrame(ts => { last = ts; tick(ts); });
</script></body></html>
