<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frost</title>
<style>
:root{--ink:#1c2b30;--mute:#7a8c92;--line:#e4eaec;--acc:#0A6C80;--bg:#f4f8f9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;font:14px/1.5 system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
nav{flex:0 0 230px;background:var(--bg);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
nav h1{font-size:15px;margin:2px 10px 8px}
.g{border:0;background:none;font:inherit;display:flex;justify-content:space-between;align-items:center;width:100%;margin:14px 0 2px;padding:2px 10px;font-size:11px;letter-spacing:.8px;color:var(--mute);font-weight:600;text-transform:uppercase;cursor:pointer;text-align:left}
.g:hover{color:var(--ink)}.g i{font-style:normal;transition:transform .15s}.g.shut i{transform:rotate(-90deg)}
.items{display:flex;flex-direction:column;gap:1px}.items.shut{display:none}
.tab{border:0;background:none;text-align:left;font:inherit;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px;width:100%}
.tab:hover{background:#e9f1f3}.tab.on{background:#dcecef;color:var(--acc);font-weight:600}.tab .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#c9d4d7;flex:none}.dot.up{background:#2e9b6a}.dot.none{background:none}
.ext{color:var(--mute);font-size:12px}
.foot{margin-top:auto;padding:14px 10px 0}.foot button{border:0;background:none;color:var(--mute);font:inherit;font-size:12px;cursor:pointer;padding:0}.foot button:hover{color:var(--ink)}
main{flex:1;position:relative;min-width:0}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}iframe.on{display:block}
#wait{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--mute)}
#home{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute)}
@media(max-width:700px){nav{flex-basis:60px}nav h1,.g,.tab .n,.ext{display:none}.items.shut{display:flex}}
</style></head><body>
<nav id="nav"><h1>Frost</h1></nav>
<main id="main"><div id="home">Pick one on the left.</div><div id="wait">Starting...</div></main>
<script>
const nav = document.getElementById('nav'), main = document.getElementById('main'), wait = document.getElementById('wait'), home = document.getElementById('home');
let cat = [], cur = null; const frames = {}; let shut = {}; try { shut = JSON.parse(localStorage.getItem('frost_shut') || '{}'); } catch (e) {}
const src = e => e.kind === 'app' ? 'http://127.0.0.1:' + e.port + '/' : '/doc/' + e.id;
async function pick(e) {
  if (e.kind === 'link') { window.open(e.url, '_blank', 'noopener'); return; }
  cur = e.id; mark(); home.style.display = 'none';
  if (!frames[e.id]) {
    wait.style.display = 'flex';
    if (e.kind === 'app') { await fetch('/api/start?id=' + e.id); for (let i = 0; i < 240; i++) { const r = await (await fetch('/api/start?id=' + e.id)).json(); if (r.up) break; await new Promise(r => setTimeout(r, 500)); } }
    if (cur !== e.id) { wait.style.display = 'none'; }
    const f = document.createElement('iframe'); f.src = src(e); main.appendChild(f); frames[e.id] = f; wait.style.display = 'none';
  }
  for (const [id, f] of Object.entries(frames)) f.classList.toggle('on', id === cur); document.title = e.name + ' · Frost'; refresh();
}
function mark() { document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.id === cur)); }
async function refresh() { cat = await (await fetch('/api/catalog')).json(); document.querySelectorAll('.dot[data-id]').forEach(d => { const e = cat.find(x => x.id === d.dataset.id); d.classList.toggle('up', !!(e && e.up)); }); }
function build() {
  const groups = [...new Set(cat.map(e => e.group))];
  for (const g of groups) {
    const h = document.createElement('button'); h.className = 'g' + (shut[g] ? ' shut' : ''); h.innerHTML = `<span>${g}</span><i>▾</i>`; nav.appendChild(h);
    const box = document.createElement('div'); box.className = 'items' + (shut[g] ? ' shut' : ''); nav.appendChild(box);
    h.onclick = () => { shut[g] = !shut[g]; h.classList.toggle('shut', shut[g]); box.classList.toggle('shut', shut[g]); try { localStorage.setItem('frost_shut', JSON.stringify(shut)); } catch (e) {} };
    for (const e of cat.filter(x => x.group === g)) {
      const b = document.createElement('button'); b.className = 'tab'; b.dataset.id = e.id; b.title = e.note;
      b.innerHTML = `<i class="dot ${e.kind === 'app' ? (e.up ? 'up' : '') : 'none'}" data-id="${e.id}"></i><span class="n">${e.name}</span>${e.kind === 'link' ? '<span class="ext">↗</span>' : ''}`;
      b.onclick = () => pick(e); box.appendChild(b);
    }
  }
  nav.insertAdjacentHTML('beforeend', '<div class="foot"><button id="stop">Stop all running apps</button></div>');
  document.getElementById('stop').onclick = async () => { await fetch('/api/stopall'); for (const f of Object.values(frames)) f.remove(); for (const k in frames) delete frames[k]; cur = null; mark(); home.style.display = 'flex'; refresh(); };
}
(async () => { cat = await (await fetch('/api/catalog')).json(); build(); setInterval(refresh, 5000); const first = cat.find(e => e.id === 'lang'); if (first) pick(first); })();
</script></body></html>
