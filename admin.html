<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Zygon admin</title>
<style>
:root{--bg:#fff;--ink:#1c1b22;--mut:#6b6a78;--line:#e4e2ee;--acc:#5b3fd0;--box:#f6f4fc}
@media (prefers-color-scheme:dark){:root{--bg:#14131b;--ink:#ecebf3;--mut:#a09fb0;--line:#34324a;--acc:#a592ff;--box:#1d1b2a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}h1{font-size:18px;margin:0 0 12px}
input,button{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--box);color:var(--ink)}button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600}
tr.u{cursor:pointer}tr.u:hover{background:var(--box)}.m{color:var(--mut)}.err{color:#d33}
.turn{border-left:2px solid var(--acc);padding:4px 10px;margin:8px 0;background:var(--box);border-radius:0 8px 8px 0}.turn b{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.q{white-space:pre-wrap;word-break:break-word}
</style></head><body><main>
<h1>Zygon.cognition · shared chats</h1>
<div class="row"><input id="key" type="password" placeholder="Admin key" size="28" autocomplete="off"><button class="p" id="go">Load users</button><input id="find" placeholder="Search text in questions…" size="30"><button id="dlj">Download all (JSON)</button><button id="dlc">Download all (CSV)</button><span id="msg" class="m"></span></div>
<div id="out"></div>
<script>
const $=s=>document.querySelector(s),out=$('#out');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let key=sessionStorage.getItem('zk')||'';if(key)$('#key').value=key;
const get=async q=>{const r=await fetch('/api/export?'+q,{headers:{'x-admin-key':$('#key').value.trim()}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('error '+r.status));return j};
const when=t=>t?new Date(t).toLocaleString():'';
$('#go').onclick=async()=>{try{sessionStorage.setItem('zk',$('#key').value.trim());$('#msg').textContent='Loading…';const {users}=await get('users=1');$('#msg').textContent=users.length+' users';
  out.innerHTML='<table><thead><tr><th>Anonymous ID</th><th>Messages</th><th>First seen</th><th>Last seen</th><th>Country</th></tr></thead><tbody>'+users.map(u=>`<tr class="u" data-u="${esc(u.uid)}"><td>${esc(u.uid.slice(0,8))}</td><td>${u.events}</td><td>${when(u.first)}</td><td>${when(u.last)}</td><td>${esc(u.country)}</td></tr>`).join('')+'</tbody></table>';
  out.querySelectorAll('tr.u').forEach(tr=>tr.onclick=()=>show(tr.dataset.u))}catch(e){$('#msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};
async function show(uid){$('#msg').textContent='Loading…';try{const {events}=await get('uid='+encodeURIComponent(uid));$('#msg').textContent=events.length+' events';const f=$('#find').value.trim().toLowerCase();
  const chats={};events.forEach(e=>{(chats[e.chat||'?']??=[]).push(e)});
  out.innerHTML='<p><a href="#" id="back">← all users</a> · user <b>'+esc(uid.slice(0,8))+'</b></p>'+Object.entries(chats).map(([c,l])=>`<h3>Chat ${esc(String(c).slice(0,8))} · ${esc(l[0].mode||'')}</h3>`+l.filter(e=>!f||JSON.stringify(e).toLowerCase().includes(f)).map(e=>`<div class="turn"><b>${esc(e.type)} · ${when(e.ts)}${e.ms!=null?' · '+e.ms+' ms':''}</b>${e.q?`<div class="q">${esc(e.q)}</div>`:''}${e.heard?`<div class="m">understood as: ${esc(e.heard)}</div>`:''}${e.title?`<div>→ <b>${esc(e.title)}</b> <span class="m">${esc(e.kind||'')} ${e.intent?'· '+esc(e.intent):''}</span></div>`:''}${(e.rows||[]).map(r=>`<div class="m">${esc(r)}</div>`).join('')}${(e.asks||[]).map(r=>`<div class="m">asked: ${esc(r)}</div>`).join('')}</div>`).join('')).join('');
  $('#back').onclick=ev=>{ev.preventDefault();$('#go').click()}}catch(e){$('#msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
const dl=(name,type,text)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()};
$('#dlj').onclick=async()=>{try{const {events}=await get('all=1');dl('zygon-chats.json','application/json',JSON.stringify(events,null,1))}catch(e){$('#msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};
$('#dlc').onclick=async()=>{try{const {events}=await get('all=1');const cols=['ts','uid','chat','n','mode','type','q','heard','intent','kind','title','ms','path','lang'];const q=v=>'"'+String(v??'').replace(/"/g,'""').replace(/\n/g,' ')+'"';dl('zygon-chats.csv','text/csv',[cols.join(','),...events.map(e=>cols.map(c=>q(e[c])).join(','))].join('\n'))}catch(e){$('#msg').innerHTML='<span class="err">'+esc(e.message)+'</span>'}};
</script></main></body></html>
